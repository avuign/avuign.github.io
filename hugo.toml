baseURL = 'https://avuign.github.io/'
title = 'Antoine Vuignier'
theme = 'PaperMod'
defaultContentLanguage = 'en'

disableLanguages = ['fr']

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  defaultTheme = "auto"
  showShareButtons = false
  showReadingTime = false
  showBreadCrumbs = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/avuign"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/avuignier/"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:ant.vuign@gmail.com"

[languages]
  [languages.en]
    languageName = "EN"
    weight = 1

    [[languages.en.menu.main]]
      name = "About"
      url = "/about/"
      weight = 1
    [[languages.en.menu.main]]
      name = "CV"
      url = "/cv/"
      weight = 2
    [[languages.en.menu.main]]
      name = "Publications"
      url = "/publications/"
      weight = 3
    [[languages.en.menu.main]]
      name = "Projects"
      url = "/projects/"
      weight = 4
    [[languages.en.menu.main]]
      name = "Blog"
      url = "/blog/"
      weight = 5

  [languages.fr]
    languageName = "FR"
    weight = 2

    [[languages.fr.menu.main]]
      name = "À propos"
      url = "/about/"
      weight = 1
    [[languages.fr.menu.main]]
      name = "CV"
      url = "/cv/"
      weight = 2
    [[languages.fr.menu.main]]
      name = "Publications"
      url = "/publications/"
      weight = 3
    [[languages.fr.menu.main]]
      name = "Projets"
      url = "/projects/"
      weight = 4
    [[languages.fr.menu.main]]
      name = "Blog"
      url = "/blog/"
      weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
